services:
  app_adhesion:
    volumes: !reset []
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:8105/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # The local stack always uses HelloAsso's isolated payment environment.
      # The three values below must be the credentials of an organization
      # created at https://www.helloasso-sandbox.com.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-helloasso-sandbox}
      HELLOASSO_CLIENT_ID: ${HELLOASSO_CLIENT_ID:-}
      HELLOASSO_CLIENT_SECRET: ${HELLOASSO_CLIENT_SECRET:-}
      HELLOASSO_ORGANIZATION_SLUG: ${HELLOASSO_ORGANIZATION_SLUG:-}
  db_adhesion:
    ports: !override
      - "8106:5432"
