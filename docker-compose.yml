services:
  client_adhesion:
    image: nginx:latest
    container_name: client_adhesion
    depends_on:
      - app_adhesion
    volumes:
      - ./client/dist/browser:/usr/share/nginx/html:ro
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_web"
      - "traefik.http.routers.client_adhesion.priority=1000"
      - "traefik.http.routers.client_adhesion.rule=Host(`adhesion.${DNS_NAME}`)"
      - "traefik.http.routers.client_adhesion.service=client_adhesion"

      - "traefik.http.routers.client_adhesion.entrypoints=websecure"
      - "traefik.http.routers.client_adhesion.tls=true"
      - "traefik.http.routers.client_adhesion.tls.certresolver=myresolver"

      # Keep these Angular route prefixes aligned with client/src/app/app.routes.ts.
      # Static files continue through the default router without path rewriting.
      - "traefik.http.routers.client_adhesion_spa.priority=1100"
      - "traefik.http.routers.client_adhesion_spa.rule=Host(`adhesion.${DNS_NAME}`) && PathRegexp(`^/(publicites|profil|agenda|accueil|chat|mes-sections|boutique|login|resetPassword|inscription|adhesions|adherents|activites|admin|maintenance|reporting|profs|seances|seances-secretariat|mail)(/.*)?$`)"
      - "traefik.http.routers.client_adhesion_spa.entrypoints=websecure"
      - "traefik.http.routers.client_adhesion_spa.tls=true"
      - "traefik.http.routers.client_adhesion_spa.tls.certresolver=myresolver"
      - "traefik.http.routers.client_adhesion_spa.middlewares=client_adhesion_spa"
      - "traefik.http.routers.client_adhesion_spa.service=client_adhesion"
      - "traefik.http.middlewares.client_adhesion_spa.replacepath.path=/index.html"
      - "traefik.http.services.client_adhesion.loadbalancer.server.port=80"

  app_adhesion:
    image: 'docker-spring-boot-adhesion'
    container_name: app_adhesion
    build:
      context: ./app
    env_file: .env
    depends_on:
      - db_adhesion
    volumes:
      - /home/ubuntu/adhesion/:/home/ubuntu/adhesion/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_adhesion:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DNS_NAME: ${DNS_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8000
      BREVO_APIKEY_PRIVATE: ${BREVO_APIKEY_PRIVATE}
      IMAGE_STORAGE_DIR: /home/ubuntu/adhesion
      # The production environment explicitly selects its profile. Local
      # docker-compose.local.yml overrides this with helloasso-sandbox.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      HELLOASSO_CLIENT_ID: ${HELLOASSO_CLIENT_ID}
      HELLOASSO_CLIENT_SECRET: ${HELLOASSO_CLIENT_SECRET}
      HELLOASSO_ORGANIZATION_SLUG: ${HELLOASSO_ORGANIZATION_SLUG}
    expose:
      - "8000"
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_web"
      - "traefik.http.routers.app_adhesion.priority=10000"
      - "traefik.http.routers.app_adhesion.rule=Host(`adhesion.${DNS_NAME}`) && PathPrefix(`/api`)"

      - "traefik.http.routers.app_adhesion.middlewares=app_adhesion-replacepathregex"
      - "traefik.http.middlewares.app_adhesion-replacepathregex.replacepathregex.regex=^/api/(.*)"
      - "traefik.http.middlewares.app_adhesion-replacepathregex.replacepathregex.replacement=/$$1"

      - "traefik.http.routers.app_adhesion.entrypoints=websecure"
      - "traefik.http.routers.app_adhesion.tls=true"
      - "traefik.http.routers.app_adhesion.tls.certresolver=myresolver"

  db_adhesion:
    image: postgres:18.0-alpine
    container_name: db_adhesion
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:          #supprimer en remote
      - "8105:5432" #supprimer en remote
    volumes:
      - data-volume:/var/lib/postgresql
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_web"
      - "traefik.tcp.routers.db_adhesion.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.db_adhesion.entrypoints=adhesion_db"
      - "traefik.tcp.services.db_adhesion.loadbalancer.server.port=5432"

volumes:
  data-volume:

networks:
  traefik_web:
    external: true
    name: traefik_web
