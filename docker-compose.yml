services:
  client_adhesion:
    image: nginx:1.30.6
    container_name: client_adhesion
    depends_on:
      - app_adhesion
    volumes:
      - type: bind
        source: ${ADHESION_FRONTEND_DIR:-./client/dist/browser}
        target: /usr/share/nginx/html/adhesion
        read_only: true
        bind:
          create_host_path: false
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client_adhesion.priority=1000"
      - "traefik.http.routers.client_adhesion.rule=(Host(`${DNS_NAME}`) || Host(`www.${DNS_NAME}`)) && PathPrefix(`/adhesion/`)"

      - "traefik.http.routers.client_adhesion.entrypoints=websecure"
      - "traefik.http.routers.client_adhesion.tls=true"
      - "traefik.http.routers.client_adhesion.tls.certresolver=myresolver"

  app_adhesion:
    image: 'docker-spring-boot-adhesion'
    container_name: app_adhesion
    build:
      context: ./app
    depends_on:
      db_adhesion:
        condition: service_healthy
    volumes:
      - /home/ubuntu/adhesion/:/home/ubuntu/adhesion/
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_adhesion:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      # Les changelogs sont embarqués dans adhesion.jar lors du packaging Maven.
      - SPRING_LIQUIBASE_ENABLED=true
      - SPRING_LIQUIBASE_CHANGE_LOG=classpath:db/changelog/db.changelog-shop.xml
      - DNS_NAME=${DNS_NAME}
      # Origines publiques, y compris lorsque Traefik termine le HTTPS.
      - ADHESION_SECURITY_CORS_ALLOWED_ORIGINS=${ADHESION_SECURITY_CORS_ALLOWED_ORIGINS:-https://${DNS_NAME},https://www.${DNS_NAME}}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8000
      - BREVO_APIKEY_PRIVATE=${BREVO_APIKEY_PRIVATE}
      - BREVO_NEWSLETTER_LIST_ID=${BREVO_NEWSLETTER_LIST_ID:-0}
      - SHOP_PAYMENT_PROVIDER=${SHOP_PAYMENT_PROVIDER:-manual}
      - HELLOASSO_BASE_URL=${HELLOASSO_BASE_URL:-https://api.helloasso-sandbox.com}
      - HELLOASSO_CLIENT_ID=${HELLOASSO_CLIENT_ID:-}
      - HELLOASSO_CLIENT_SECRET=${HELLOASSO_CLIENT_SECRET:-}
      - HELLOASSO_ORGANIZATION_SLUG=${HELLOASSO_ORGANIZATION_SLUG:-}
      - HELLOASSO_WEBHOOK_SIGNATURE_KEY=${HELLOASSO_WEBHOOK_SIGNATURE_KEY:-}
      - IMAGE_STORAGE_DIR=/home/ubuntu/adhesion
    expose:
      - "8000"
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app_adhesion.priority=10000"
      - "traefik.http.routers.app_adhesion.rule=(Host(`${DNS_NAME}`) || Host(`www.${DNS_NAME}`)) && PathPrefix(`/adhesion/api/`)"

      - "traefik.http.routers.app_adhesion.middlewares=app_adhesion-replacepathregex"
      - "traefik.http.middlewares.app_adhesion-replacepathregex.replacepathregex.regex=^/adhesion/api/(.*)"
      - "traefik.http.middlewares.app_adhesion-replacepathregex.replacepathregex.replacement=/$$1"

      - "traefik.http.routers.app_adhesion.entrypoints=websecure"
      - "traefik.http.routers.app_adhesion.tls=true"
      - "traefik.http.routers.app_adhesion.tls.certresolver=myresolver"

  db_adhesion:
    image: postgres:17.6-alpine
    container_name: db_adhesion
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:          #supprimer en remote
      - "8105:5432" #supprimer en remote
    volumes:
      - data-volume:/var/lib/postgresql
    networks:
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.db_adhesion.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.db_adhesion.entrypoints=adhesion_db"
      - "traefik.tcp.services.db_adhesion.loadbalancer.server.port=5432"

volumes:
  data-volume:

networks:
  traefik_web:
