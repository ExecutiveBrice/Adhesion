name: Backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Compiler et tester le backend
        run: mvn -B -ntp verify

      - name: Verifier la construction de l'image
        run: docker build --tag adhesion-backend:ci .
