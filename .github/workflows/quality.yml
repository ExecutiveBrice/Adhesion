name: Quality

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specifications:
    name: Specifications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test scripts/check-specs.test.mjs
      - run: node scripts/check-specs.mjs
      - run: git diff --check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/pom.xml
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: app/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build:production

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: migration
          POSTGRES_USER: migration
          POSTGRES_PASSWORD: migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration -d migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/migration
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/pom.xml
      - run: mvn -B -ntp -Dtest=LiquibaseMigrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-migration-results
          path: app/target/surefire-reports/
          retention-days: 7

  quality-gate:
    name: Quality gate
    if: always()
    needs: [specifications, backend, frontend, browser, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          SPECIFICATIONS: ${{ needs.specifications.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
        run: |
          for result in "$SPECIFICATIONS" "$BACKEND" "$FRONTEND" "$BROWSER" "$MIGRATIONS"; do
            if [ "$result" != "success" ]; then
              echo "A required validation failed, was cancelled, or did not run."
              exit 1
            fi
          done
