spring:
  main:
    allow-circular-references: true
  h2.console.enabled: true
  # default path: h2-console
  h2.console.path: /h2-ui
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    show_sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: update
      show_sql: false
      format_sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

#logging.level.org.springframework.web: DEBUG
logging.level.com.wild.corp: INFO
logging.level.org.hibernate: ERROR

server:
  name : ${DNS_NAME}
  app:
    # Une clé d'au moins 64 octets est requise pour signer les jetons en HS512.
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: 86400000

image-storage-dir: C:\Users\brice\Documents

# Zone scolaire utilisée lors de la génération hebdomadaire des séances (A, B ou C).
adhesion:
  security:
    password-reset:
      token-lifetime-minutes: 30
      rate-limit:
        ip: 20
        address: 5
        window-seconds: 3600
        max-tracked-keys: 100000
  calendrier:
    zone: ${ZONE_SCOLAIRE:C}
    jours-feries-dataset: ${JOURS_FERIES_DATASET:jours-ouvres-week-end-feries-france-2010-a-2030}
