spring:
  # Le fichier .env est utilisé uniquement par les démarrages locaux de l'IDE.
  # L'import est optionnel : les environnements distants conservent leurs
  # variables injectées au démarrage quand ce fichier est absent.
  config:
    import: optional:classpath:.env[.properties]
  main:
    allow-circular-references: true
  h2.console.enabled: true
  # default path: h2-console
  h2.console.path: /h2-ui
  datasource:
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    show_sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
      show_sql: false
      format_sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    openfeign:
      client:
        config:
          helloAssoCheckoutClient:
            connect-timeout: 3000
            read-timeout: 10000
            logger-level: basic
          helloAssoOAuthClient:
            connect-timeout: 3000
            read-timeout: 10000
            logger-level: basic

server:
  name : ${DNS_NAME}
  app:
    # Une clé d'au moins 64 octets est requise pour signer les jetons en HS512.
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

image-storage-dir: C:\Users\brice\Documents

shop:
  order:
    expiry-scan-delay-ms: ${SHOP_ORDER_EXPIRY_SCAN_DELAY_MS:60000}
    expiry-initial-delay-ms: ${SHOP_ORDER_EXPIRY_INITIAL_DELAY_MS:30000}
  payment:
    # Aucun secret ici : ils devront être fournis par variables d'environnement
    # dans la configuration propre à l'adaptateur choisi.
    provider: ${SHOP_PAYMENT_PROVIDER:manual}
    reconciliation:
      enabled: ${SHOP_PAYMENT_RECONCILIATION_ENABLED:true}
      fixed-delay-ms: ${SHOP_PAYMENT_RECONCILIATION_DELAY_MS:120000}
      initial-delay-ms: ${SHOP_PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:30000}
      batch-size: ${SHOP_PAYMENT_RECONCILIATION_BATCH_SIZE:50}
    helloasso:
      # L'URL non secrète par défaut permet le démarrage avec le provider manuel.
      # Les profils helloasso-sandbox et helloasso-production sélectionnent explicitement leur environnement.
      base-url: ${HELLOASSO_BASE_URL:https://api.helloasso-sandbox.com}
      client-id: ${HELLOASSO_CLIENT_ID:}
      client-secret: ${HELLOASSO_CLIENT_SECRET:}
      organization-slug: ${HELLOASSO_ORGANIZATION_SLUG:}
      webhook-signature-key: ${HELLOASSO_WEBHOOK_SIGNATURE_KEY:}

# Zone scolaire utilisée lors de la génération hebdomadaire des séances (A, B ou C).
adhesion:
  security:
    cors:
      # Liste séparée par des virgules. À surcharger avec ADHESION_SECURITY_CORS_ALLOWED_ORIGINS
      # lorsqu'un frontend distant appelle directement l'API.
      allowed-origins: ${ADHESION_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
    password-reset:
      token-lifetime-minutes: 30
      rate-limit:
        ip: 20
        address: 5
        window-seconds: 3600
        max-tracked-keys: 100000
  calendrier:
    zone: ${ZONE_SCOLAIRE:C}
    jours-feries-dataset: ${JOURS_FERIES_DATASET:jours-ouvres-week-end-feries-france-2010-a-2030}
