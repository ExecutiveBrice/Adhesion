services:
  app_adhesion:
    image: ${BACKEND_IMAGE_WITH_TAG:?BACKEND_IMAGE_WITH_TAG doit etre defini}
    container_name: app_adhesion
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-db_adhesion}:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DNS_NAME: ${DNS_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8000
      MJ_MAIL: ${MJ_MAIL:-}
      MJ_APIKEY_PUBLIC: ${MJ_APIKEY_PUBLIC:-}
      MJ_APIKEY_PRIVATE: ${MJ_APIKEY_PRIVATE:-}
      BREVO_APIKEY_PRIVATE: ${BREVO_APIKEY_PRIVATE:-}
      IMAGE_STORAGE_DIR: /data
      ZONE_SCOLAIRE: ${ZONE_SCOLAIRE:-C}
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
    expose:
      - "8000"
    networks:
      - adhesion_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app_adhesion.priority=10000"
      - "traefik.http.routers.app_adhesion.rule=(Host(`${DNS_NAME}`) || Host(`www.${DNS_NAME}`)) && PathPrefix(`/adhesion/api/`)"
      - "traefik.http.routers.app_adhesion.middlewares=app_adhesion-replacepathregex"
      - "traefik.http.middlewares.app_adhesion-replacepathregex.replacepathregex.regex=^/adhesion/api/(.*)"
      - "traefik.http.middlewares.app_adhesion-replacepathregex.replacepathregex.replacement=/$$1"
      - "traefik.http.routers.app_adhesion.entrypoints=websecure"
      - "traefik.http.routers.app_adhesion.tls=true"
      - "traefik.http.routers.app_adhesion.tls.certresolver=myresolver"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8000/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 6

networks:
  adhesion_network:
    external: true
    name: ${DOCKER_NETWORK:-adhesion_traefik_web}
